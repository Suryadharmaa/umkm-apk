[versions]
agp = "8.13.2"
kotlin = "2.2.21"
ksp = "2.2.21-2.0.4"
hilt = "2.57.2"
room = "2.8.4"
compose = "2025.11.01"
lifecycle = "2.10.0"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose" }
activity = { module = "androidx.activity:activity-compose", version = "1.12.0" }
lifecycle-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
navigation = { module = "androidx.navigation:navigation-compose", version = "2.9.6" }
material3 = { module = "androidx.compose.material3:material3" }
icons = { module = "androidx.compose.material:material-icons-core", version = "1.7.8" }
preview = { module = "androidx.compose.ui:ui-tooling-preview" }
tooling = { module = "androidx.compose.ui:ui-tooling" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
hilt = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
tink = { module = "com.google.crypto.tink:tink-android", version = "1.24.0" }
zxing = { module = "com.google.zxing:core", version = "3.5.4" }
junit = { module = "junit:junit", version = "4.13.2" }
android-junit = { module = "androidx.test.ext:junit", version = "1.3.0" }
test-runner = { module = "androidx.test:runner", version = "1.7.0" }
compose-test = { module = "androidx.compose.ui:ui-test-junit4" }
compose-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

[plugins]
android = { id = "com.android.application", version.ref = "agp" }
kotlin = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
room = { id = "androidx.room", version.ref = "room" }
